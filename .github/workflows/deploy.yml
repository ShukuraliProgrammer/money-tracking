# Testlar va serverga joylash.
#
# - Pull request: faqat testlar.
# - main branchiga push: testlar o'tsa, serverga joylanadi.
# - Qo'lda: Actions → "CI/CD" → "Run workflow".
#
# Kerakli sirlar (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         server IP yoki domeni
#   DEPLOY_USER         serverdagi foydalanuvchi (deploy/server-setup.sh yaratadi: deploy)
#   DEPLOY_SSH_KEY      shu foydalanuvchining SSH maxfiy kaliti (parol emas)
#   DEPLOY_PORT         ixtiyoriy, SSH porti (standart 22)
#   DEPLOY_PATH         ixtiyoriy, serverdagi papka (standart /opt/moneytrack)
#   DEPLOY_KNOWN_HOSTS  ixtiyoriy, serverning host kaliti (deploy/server-setup.sh chiqarib beradi)
#
# Bot tokeni va boshqa sozlamalar GitHub'da saqlanmaydi: ular serverdagi .env faylida turadi.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    name: Serverga joylash
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/moneytrack' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH'ni sozlash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_USER va DEPLOY_SSH_KEY sirlari kiritilmagan (README: Serverga joylash)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Host kaliti berilmagan: server kaliti shu yerda birinchi ko'rilganicha qabul qilinadi.
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          {
            echo "Host server"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port $DEPLOY_PORT"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Kodni serverga ko'chirish
        run: |
          # .env va ma'lumotlar serverda qoladi: ular ko'chirilmaydi ham, o'chirilmaydi ham.
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude '.venv/' --exclude 'tests/' \
            --exclude 'data/' --exclude '.env' --exclude '__pycache__/' --exclude '.pytest_cache/' \
            ./ "server:$DEPLOY_PATH/"

      - name: Botni qayta yig'ib ishga tushirish
        run: |
          ssh server "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ ! -s .env ]; then
            echo "::error::$DEPLOY_PATH/.env topilmadi yoki bo'sh. Uni serverda bir marta to'ldiring."
            exit 1
          fi
          docker compose up -d --build --remove-orphans
          # Bot ishga tushib, yiqilmay turganini tekshiramiz: 20 soniya ichida konteyner ishlab turishi
          # va biror marta ham qayta ishga tushmagan bo'lishi kerak (yiqilsa, Docker uni qayta-qayta ko'taradi).
          container="$(docker compose ps -aq bot)"
          restarts_before="$(docker inspect -f '{{.RestartCount}}' "$container")"
          sleep 20
          state="$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$container")"
          if [ "$state" != "true $restarts_before" ]; then
            echo "::error::Bot ishga tushmadi yoki yiqilib qayta ishga tushyapti. Oxirgi loglar:"
            docker compose logs --tail 40 bot
            exit 1
          fi
          docker image prune -f > /dev/null
          echo "Bot ishlayapti."
          REMOTE

      - name: SSH kalitini o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key
