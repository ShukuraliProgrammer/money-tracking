# Testlar va serverni yangilash.
#
# - Pull request: faqat testlar.
# - main branchiga push yoki qo'lda (Actions → "CI/CD" → "Run workflow"): testlar o'tsa,
#   serverdagi repo nusxasida "git pull" va "docker compose up -d --build" bajariladi.
#
# Kod serverga oldindan "git clone" bilan qo'yilgan bo'lishi kerak (README: Serverga joylash).
#
# Sirlar (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server IP yoki domeni
#   DEPLOY_USER     repo'ni clone qilgan foydalanuvchi
#   DEPLOY_SSH_KEY  shu foydalanuvchining SSH maxfiy kaliti
#   DEPLOY_PATH     ixtiyoriy: repo papkasi (standart: uy papkasidagi money-tracking)
#   DEPLOY_PORT     ixtiyoriy: SSH porti (standart 22)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    # Bot PostgreSQL bilan ishlaydi, shuning uchun testlar ham PostgreSQL'da o'tadi.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moneytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/moneytrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    name: Serverni yangilash
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: git pull va docker compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'money-tracking' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_USER va DEPLOY_SSH_KEY sirlari kiritilmagan (README: Serverga joylash)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git checkout --quiet "$BRANCH"
          git pull --quiet --ff-only origin "$BRANCH"
          echo "Kod: $(git log -1 --format='%h %s')"
          docker compose up -d --build --remove-orphans

          # Bot yiqilmay turganini tekshiramiz: 20 soniya ichida ishlab turishi va biror marta ham
          # qayta ishga tushmagan bo'lishi kerak (yiqilsa, Docker uni qayta-qayta ko'taradi).
          container="$(docker compose ps -aq bot)"
          restarts_before="$(docker inspect -f '{{.RestartCount}}' "$container")"
          sleep 20
          state="$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$container")"
          if [ "$state" != "true $restarts_before" ]; then
            echo "::error::Bot ishga tushmadi yoki yiqilib qayta ishga tushyapti. Oxirgi loglar:"
            docker compose logs --tail 40 bot
            exit 1
          fi
          echo "Bot ishlayapti."
          REMOTE
